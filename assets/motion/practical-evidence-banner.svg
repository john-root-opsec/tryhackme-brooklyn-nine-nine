<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
<title id="title">Brooklyn Nine-Nine — Practical Penetration Testing — Case 001</title>
<desc id="desc">Precinct 99 Cyber Operations animated evidence banner for an authorized TryHackMe lab.</desc>
<defs>
