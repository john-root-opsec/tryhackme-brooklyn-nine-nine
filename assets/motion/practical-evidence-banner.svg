  <linearGradient id="neon"><stop stop-color="#c5ffd9"/><stop offset=".55" stop-color="#39ff88"/><stop offset="1" stop-color="#0da85a"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#39ff88" stroke-opacity=".12" stroke-width="1"/></pattern>
