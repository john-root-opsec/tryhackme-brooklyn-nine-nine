<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
<title id="t">Brooklyn Nine-Nine Cybersecurity Lab</title>
<desc id="d">Dark hacker-style banner with neon green technical grid, cyber globe and Brooklyn Nine-Nine project title.</desc>
<defs>
